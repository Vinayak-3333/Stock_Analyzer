# ── StockRadar IN — NAS Docker Compose ────────────────────────────────────────
# PURPOSE : Full self-hosted deployment on a NAS server (Synology / QNAP / etc.)
# USAGE   : docker compose -f docker-compose.nas.yml up -d
# NOTE    : This is SEPARATE from the Vercel frontend — do not mix them.
#           The Vercel frontend continues to run independently.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend: FastAPI + APScheduler ──────────────────────────────────────────
  stockradar-backend:
    build:
      context: .                        # project root (needs Analyzer.py + core/)
      dockerfile: Dockerfile.backend
    container_name: stockradar-backend
    restart: unless-stopped
    ports:
      - "8000:8000"                     # Expose backend on NAS port 8000
    volumes:
      # Persist SQLite + DuckDB databases to NAS storage
      # Change left side to your NAS shared folder path
      - ./nas-data/backend:/app/backend/data
    environment:
      # ── Email alerts ──────────────────────────────────────────────────────
      - GMAIL_SENDER=${GMAIL_SENDER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - RECIPIENT_EMAIL=${RECIPIENT_EMAIL}
      # ── OIDC auth (REQUIRED) ──────────────────────────────────────────────
      # Without OIDC_CLIENT_ID/SECRET the backend boots with auth disabled:
      # /auth/* returns 503 and every /api/* route 401s, with no way to log in.
      # OIDC_REDIRECT_URI must exactly match an Authorized redirect URI on the
      # Google Cloud OAuth client.
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}          # defaults to RECIPIENT_EMAIL
      # ── Session (REQUIRED) ────────────────────────────────────────────────
      # SESSION_SECRET must be set and stable, or every container restart
      # silently invalidates all sessions. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      - SESSION_SECRET=${SESSION_SECRET}
      # Behind this nginx the SPA and API share an origin, so lax is correct.
      # Only a cross-site frontend (e.g. Vercel) needs none + secure=true.
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-lax}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      # ── Hardening (Phase 4) ───────────────────────────────────────────────
      # Requests arrive via the nginx container, so X-Forwarded-For is set by a
      # trusted hop — without this every client shares one rate-limit bucket.
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-true}
      - SECURITY_HSTS_ENABLED=${SECURITY_HSTS_ENABLED:-false}   # true once TLS terminates in front
      - DOCS_ENABLED=${DOCS_ENABLED:-false}
      # ── Python settings ───────────────────────────────────────────────────
      - PYTHONUTF8=1
      - TZ=Asia/Kolkata
    networks:
      - stockradar-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frontend: React (Vite build) served by Nginx ────────────────────────────
  stockradar-frontend:
    build:
      context: ./frontend               # build context is frontend/
      dockerfile: Dockerfile.frontend
      args:
        # Nginx proxies /api/* to backend container internally
        # So the frontend just calls /api/ (same origin — no CORS)
        VITE_API_URL: /api
    container_name: stockradar-frontend
    restart: unless-stopped
    ports:
      - "3000:80"                       # Access dashboard at http://NAS-IP:3000
    depends_on:
      stockradar-backend:
        condition: service_healthy
    networks:
      - stockradar-net

networks:
  stockradar-net:
    driver: bridge
