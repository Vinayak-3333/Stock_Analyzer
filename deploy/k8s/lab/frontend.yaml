# ── Frontend: SPA + reverse proxy for /api and /auth ──────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockradar-frontend
  labels: { app: stockradar-frontend }
spec:
  # Stateless, so this one can run several copies and roll without downtime.
  replicas: 2
  selector:
    matchLabels: { app: stockradar-frontend }
  template:
    metadata:
      labels: { app: stockradar-frontend }
    spec:
      containers:
        - name: frontend
          # Tag pinned to a commit SHA in kustomization.yaml (`images:`).
          image: ghcr.io/vinayak-3333/stock-analyzer-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: stockradar-frontend
spec:
  selector: { app: stockradar-frontend }
  ports:
    - port: 80
      targetPort: 80
