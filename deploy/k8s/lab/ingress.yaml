# Traefik (bundled with k3s) routes every host and path to the frontend;
# nginx inside it forwards /api and /auth on to the backend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockradar
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockradar-frontend
                port:
                  number: 80
