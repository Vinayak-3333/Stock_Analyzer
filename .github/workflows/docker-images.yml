name: Build Docker Images

# master publishes :latest (what the live VM pulls) plus :<sha>.
# alt-approach publishes :<sha> only, so the k8s lab can pin a branch build
# without anything reaching the live VM.
on:
  push:
    branches:
      - master
      - alt-approach
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deploy/k8s/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/vinayak-3333/stock-analyzer-backend
  FRONTEND_IMAGE: ghcr.io/vinayak-3333/stock-analyzer-frontend

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest only from master; an empty line in `tags` is skipped.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/master' && format('{0}:latest', env.BACKEND_IMAGE) || '' }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ github.ref == 'refs/heads/master' && format('{0}:latest', env.FRONTEND_IMAGE) || '' }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
